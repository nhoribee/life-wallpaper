[project]
name = "life-wallpaper"
version = "0.1.0"
license = "MIT"
description = "Generate Game of Life / elementary cellular automaton wallpapers and set them per display on macOS"
readme = "README.md"
requires-python = ">=3.13"
# numpy は盤面の計算、pillow は画像と GIF の書き出しに使う。
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifewallpaper"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
